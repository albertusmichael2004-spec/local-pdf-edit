[project]
name = "local-pdf-workbench"
version = "4.1.0"
description = "Private local desktop PDF utilities powered by FastAPI and PyWebView."
requires-python = ">=3.11,<3.14"

[project.gui-scripts]
LocalPDFWorkbench = "desktop:main"

[tool.setuptools]
py-modules = ["desktop", "run"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --basetemp=.cache/pytest-tmp"
cache_dir = ".cache/pytest"

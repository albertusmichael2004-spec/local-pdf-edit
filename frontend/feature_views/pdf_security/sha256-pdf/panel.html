<section class="tool-panel" data-title="SHA-256 PDF" id="sha256"><div class="panel-intro"><h2>SHA-256 PDF</h2><p>Generate a cryptographic fingerprint for a PDF to verify file integrity later.</p></div><div class="dropzone" data-input="shaFile"><input accept="application/pdf,.pdf" hidden="" id="shaFile" type="file"/><div class="drop-icon">＋</div><strong>Drop PDF</strong><span>SHA-256 changes if even one byte changes.</span></div><div class="file-meta hidden" data-filemeta-for="shaFile"></div><button class="btn primary" id="shaBtn">Generate SHA-256</button><div class="status hidden hash-output" id="shaStatus"></div></section>

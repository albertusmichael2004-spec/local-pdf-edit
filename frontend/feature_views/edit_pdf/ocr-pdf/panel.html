<section class="tool-panel" data-title="OCR PDF" id="ocr"><div class="panel-intro"><h2>OCR PDF</h2><p>Turn scanned pages into a searchable PDF using local Tesseract OCR.</p></div><div class="dropzone" data-input="ocrFile"><input accept="application/pdf,.pdf" hidden="" id="ocrFile" type="file"/><div class="drop-icon">＋</div><strong>Drop scanned PDF</strong><span>OCR rasterizes pages and adds a searchable text layer.</span></div><div class="file-meta hidden" data-filemeta-for="ocrFile"></div><div class="two-col"><label class="field"><span>Tesseract language code</span><input id="ocrLanguage" placeholder="eng" value="eng"/></label><label class="field"><span>Render DPI</span><input id="ocrDpi" max="300" min="120" type="number" value="200"/></label></div><button class="btn primary" id="ocrBtn">Run OCR</button><div class="status hidden" id="ocrStatus"></div></section>

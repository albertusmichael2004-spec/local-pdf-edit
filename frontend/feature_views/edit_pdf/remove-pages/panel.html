<section class="tool-panel" data-title="Remove pages" id="remove-pages"><div class="panel-intro"><h2>Remove pages</h2><p>Delete selected pages while keeping the rest of the document.</p></div><div class="dropzone" data-input="removeFile"><input accept="application/pdf,.pdf" hidden="" id="removeFile" type="file"/><div class="drop-icon">＋</div><strong>Drop PDF</strong><span>Example selection: 2,4-6,10</span></div><div class="file-meta hidden" data-filemeta-for="removeFile"></div><label class="field"><span>Pages to remove</span><input id="removePagesInput" placeholder="2,4-6,10" type="text"/></label><button class="btn primary" id="removePagesBtn">Remove pages</button><div class="status hidden" id="removePagesStatus"></div></section>

<section class="tool-panel" data-title="Remove pages" id="remove-pages">
  <div class="panel-intro">
    <h2>Remove pages</h2>
    <p>Select page thumbnails to delete while keeping the rest of the document.</p>
  </div>
  <div class="dropzone" data-input="removeFile">
    <input accept="application/pdf,.pdf" hidden id="removeFile" type="file"/>
    <div class="drop-icon">＋</div><strong>Drop PDF</strong><span>Upload once, then select pages below.</span>
  </div>
  <div class="file-meta hidden" data-filemeta-for="removeFile"></div>
  <div class="page-workspace-wrap hidden" id="removeWorkspaceWrap">
    <div class="page-workspace-header">
      <div><strong>Pages to remove</strong><span>Click thumbnails or check boxes to select pages.</span></div>
      <span id="removeSelectionCount">0 selected</span>
    </div>
    <div class="page-workspace scrollable-page-box" id="removePageWorkspace"></div>
  </div>
  <label class="field"><span>Page selection</span>
    <input id="removePagesInput" placeholder="2,4-6,10" type="text"/>
  </label>
  <button class="btn primary" id="removePagesBtn">Remove selected pages</button>
  <div class="status hidden" id="removePagesStatus"></div>
</section>

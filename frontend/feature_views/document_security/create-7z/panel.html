<section class="tool-panel" data-title="Create 7z Archive" id="create-7z">
  <div class="panel-intro"><h2>Create 7z Archive</h2><p>Convert any document, image, ZIP, or other file into a compact 7z archive without encryption.</p></div>
  <div class="dropzone" data-input="create7zFile"><input hidden id="create7zFile" type="file"/><div class="drop-icon">＋</div><strong>Drop any file</strong><span>The file is compressed locally into a .7z container.</span></div>
  <div class="file-meta hidden" data-filemeta-for="create7zFile"></div>
  <p class="helper security-note">Need encryption too? Use All in One or AES-256 Encrypt.</p>
  <button class="btn primary" id="create7zBtn">Create 7z archive</button>
  <div class="status hidden" id="create7zStatus"></div>
</section>

<section class="tool-panel" data-title="Password Protect File" id="document-password-protect">
  <div class="panel-intro"><h2>Password Protect File</h2><p>Put any document, image, archive, or other file into a password-protected ZIP using WinZip-compatible AES-256 encryption.</p></div>
  <div class="dropzone" data-input="passwordProtectFile"><input hidden id="passwordProtectFile" type="file"/><div class="drop-icon">＋</div><strong>Drop any file</strong><span>The original file is not changed.</span></div>
  <div class="file-meta hidden" data-filemeta-for="passwordProtectFile"></div>
  <div class="two-col">
    <label class="field"><span>Password</span><input autocomplete="new-password" id="passwordProtectPassword" minlength="8" type="password"/></label>
    <label class="field"><span>Confirm password</span><input autocomplete="new-password" id="passwordProtectConfirm" minlength="8" type="password"/></label>
  </div>
  <p class="helper security-note">Output: .zip with AES-256 encrypted file contents. Use an archive app that supports WinZip AES.</p>
  <button class="btn primary" id="passwordProtectBtn">Create protected ZIP</button>
  <div class="status hidden" id="passwordProtectStatus"></div>
</section>
